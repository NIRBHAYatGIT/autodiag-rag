services:
  - type: web
    name: autodiag-rag
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
